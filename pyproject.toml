[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pnd"
version = "0.1.0"
description = "Bug-for-bug modular re-implementation of Hu et al. (SIGMOD 2023) P&D target coin prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1,<2.3",
  "scikit-learn>=1.3,<1.6",
  "nltk>=3.8",
  "emoji>=2.0",
  "urlextract>=1.8",
  "pytz",
  "pyyaml>=6",
  "typer>=0.12",
  "tensorflow==2.15.*",
  "tensorflow-intel==2.15.* ; sys_platform == 'win32'",
  "reportlab>=4.0",
]

[project.optional-dependencies]
telegram  = ["telethon>=1.34"]
coingecko = ["pycoingecko>=3.1"]
dev       = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
paper     = [
  "jupyter", "ipykernel", "nbclient", "nbformat", "nbconvert[webpdf]>=7",
  "matplotlib>=3.8", "seaborn>=0.13", "scipy>=1.11", "statsmodels>=0.14", "arch>=6.2",
  "lightgbm>=4.1", "shap>=0.44", "optuna>=3.5", "networkx>=3.2", "torch>=2.2",
  "vaderSentiment>=3.3", "pyarrow>=14,<20", "tabulate",
]

[project.scripts]
pnd = "pnd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pnd", "src/pnd_paper"]

[tool.uv]
# tensorflow-io-gcs-filesystem stopped shipping Windows wheels after 0.31.0
constraint-dependencies = ["tensorflow-io-gcs-filesystem==0.31.0 ; sys_platform == 'win32'"]

[tool.ruff]
line-length = 150   # ported lines are kept intact (R1)
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N"]   # no pyupgrade: ported code keeps the original syntax (R1)
ignore = ["E722", "N801", "N802", "N803", "N806", "B007", "B008", "B905", "E741"]   # original names / loops / bare except kept (R1); B008 = typer options

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet (Binance)", "tf: builds TensorFlow graphs (slow)"]
addopts = "-m 'not network'"

[tool.ruff.lint.per-file-ignores]
# notebook sources: Markdown tables/LaTeX lines are long, imports follow notebook cell order, S/F are the usual aliases
"notebooks/**" = ["E501", "N812", "N816", "I001", "E402"]
